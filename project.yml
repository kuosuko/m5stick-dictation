name: StickDictation
options:
  developmentLanguage: zh-Hant
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1"
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    CURRENT_PROJECT_VERSION: "1"
targets:
  DuoDictate:
    type: application
    platform: iOS
    sources: [iOS, Shared, KeyboardShared]
    dependencies:
      - target: StickKeyboard
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).duo
        # Stick.entitlements, or Stick-PCC.entitlements with Private Cloud
        # Compute for Dreaming; chosen in Config/*.xcconfig.
        CODE_SIGN_ENTITLEMENTS: $(STICK_APP_ENTITLEMENTS)
        PRODUCT_NAME: Stick
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: iOS/Info.plist
      properties:
        CFBundleDisplayName: Stick
        StickAppGroup: group.$(BUNDLE_ID_PREFIX)
        StickKeychainGroup: $(AppIdentifierPrefix)$(BUNDLE_ID_PREFIX).shared
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UIBackgroundModes: [bluetooth-central]
        BGTaskSchedulerPermittedIdentifiers: ["$(PRODUCT_BUNDLE_IDENTIFIER).dreaming.*"]
        NSBluetoothAlwaysUsageDescription: 用藍牙接收 Stick 錄到的聲音。
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
  StickSim:
    type: application
    platform: macOS
    sources: [macOS, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).sim
        ENABLE_HARDENED_RUNTIME: NO
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: macOS/Info.plist
      properties:
        LSApplicationCategoryType: public.app-category.developer-tools
        NSBluetoothAlwaysUsageDescription: 讓 iPhone 透過藍牙連到這台模擬 Stick。
        NSMicrophoneUsageDescription: 按住說話時錄音，傳給 iPhone 轉寫。
  StickKeyboard:
    type: app-extension
    platform: iOS
    sources: [Keyboard, KeyboardShared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).duo.keyboard
        PRODUCT_NAME: StickKeyboard
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
    entitlements:
      path: Keyboard/StickKeyboard.entitlements
      properties:
        com.apple.security.application-groups: [group.$(BUNDLE_ID_PREFIX)]
        keychain-access-groups: ["$(AppIdentifierPrefix)$(BUNDLE_ID_PREFIX).shared"]
    info:
      path: Keyboard/Info.plist
      properties:
        CFBundleDisplayName: Stick
        StickAppGroup: group.$(BUNDLE_ID_PREFIX)
        StickKeychainGroup: $(AppIdentifierPrefix)$(BUNDLE_ID_PREFIX).shared
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: false
            PrefersRightToLeft: false
            PrimaryLanguage: zh-Hant
            RequestsOpenAccess: true
