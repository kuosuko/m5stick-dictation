; M5StickS3 firmware for StickDictation. Speaks PROTOCOL.md, same as StickSim.
; Board settings follow M5's own PlatformIO env for the StickS3.
[env:sticks3]
; pioarduino (Arduino 3.x on ESP-IDF 5.5): unlike the stock 6.x platform it
; can rebuild ESP-IDF with our own sdkconfig, which light sleep needs.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.partitions = default_8MB.csv
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 8MB
monitor_speed = 115200
build_flags =
    -DESP32S3
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=1
; Light sleep between BLE events: ESP-IDF rebuilt with power management,
; tickless idle and the BLE controller's modem sleep. The main crystal stays
; on in light sleep because the StickS3 has no 32 kHz one for BLE timing.
custom_sdkconfig =
    CONFIG_PM_ENABLE=y
    CONFIG_FREERTOS_USE_TICKLESS_IDLE=y
    CONFIG_FREERTOS_IDLE_TIME_BEFORE_SLEEP=3
    CONFIG_BT_CTRL_MODEM_SLEEP=y
    CONFIG_BT_CTRL_MODEM_SLEEP_MODE_1=y
    CONFIG_BT_CTRL_LPCLK_SEL_MAIN_XTAL=y
    CONFIG_BT_CTRL_MAIN_XTAL_PU_DURING_LIGHT_SLEEP=y
; Anti-aliased Noto Sans TC, built by tools/make_fonts.py.
board_build.embed_files =
    fonts/body.vlw
    fonts/label.vlw
    fonts/title.vlw
    fonts/clock.vlw
lib_deps =
    m5stack/M5Unified@^0.2.29
    m5stack/M5GFX@^0.2.35
    h2zero/NimBLE-Arduino@^2.3.0
